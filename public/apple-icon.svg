<!--
  The home-screen icon: the same H, full-bleed.

  No rounded corners here, unlike the favicon: iOS applies its own mask,
  and a tile that has already been rounded ends up with a pale halo where
  the two radii disagree.

  It matches the favicon deliberately. Spec A9 asks for the blue sun on a
  cream tile, and the sun does read at 180px — but an app icon that is a
  sun beside a browser tab that is an H would be two identities for one
  product, and the smaller one is the one people see most.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Heyday">
  <rect width="180" height="180" fill="#F26B2A"/>
  <path
    d="M45 45h22.5v31h45V45H135v90h-22.5v-36.5h-45V135H45z"
    fill="#0A0A0A"
  />
</svg>
